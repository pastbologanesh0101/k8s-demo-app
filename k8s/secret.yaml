# TEMPLATE / EXAMPLE ONLY -- NOT REAL CREDENTIALS.
#
# This file is committed only to show the shape of a Secret and how it is
# wired into the Deployment. Do NOT put real credentials in a file like
# this in a real project; it would be committed to git in plaintext.
#
# In a real cluster you would instead create this with:
#   kubectl create secret generic k8s-demo-app-secret \
#     --from-literal=API_TOKEN=<real-token>
# or manage it via a secrets manager (Sealed Secrets, External Secrets
# Operator, Vault, SOPS, etc.) rather than checking it into version control.
#
# The value below is the base64 encoding of the placeholder string
# "example-placeholder-token-not-real", included only so this manifest is
# structurally valid YAML/Secret data.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-demo-app-secret
  labels:
    app: k8s-demo-app
type: Opaque
data:
  API_TOKEN: ZXhhbXBsZS1wbGFjZWhvbGRlci10b2tlbi1ub3QtcmVhbA==
