apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-demo-app
  labels:
    app: k8s-demo-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: k8s-demo-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-demo-app
                port:
                  number: 80
